name: 10x6_labyrinth
geometry:
  mesh: geometry/labyrinth_2d_very_coarse.msh
  occupancy_yaml: geometry/occupancy.yaml
  occupancy_image: geometry/occupancy.pgm
  wall_pattern: wall|obstacle
  outflow_pattern: outlet|outflow
data:
  wind_csv: wind_gt.csv
  sample_dir: samples
  result_dir: results
measurement_noise:
  wind_noise_std: 0.1
ground_truth_slicing:
  z_height: 0.025
  z_tol: 0.025
  max_xy_dist: 0.2
ns_solver_parameters:
  solver: linear_least_squares
  regularization: smooth
  maxit: 25
  tol: 0.01
  damping: 0.5
  viscosity: 1.0e-05
  weight_misfit: 10.0
  weight_pde_res: 1.0
  weight_reg: 1e-5
  weight_boundary: 1.0
gmrf_parameters:
  cell_size: 0.2
  var_speed: 0.01
  var_direction: 0.01
  batch_size: 25
  lambda_advection: 1.0
  lambda_mass_conservation: 100.0
  lambda_diffusion: 1.0
  lambda_obstacles: 100.0
  num_iterations_MAP: 25
gp_parameters:
  length_scale: 0.35
  optimize_length_scale: false
  grid_cell_size: 0.2
meta:
  description: 10x6 room with labyrinth profile
wind_sample_sizes:
- 10  
- 25
- 50
- 75
- 100
- 125
- 150
- 175
- 200
- 225
- 250